    <rect x="-96" y="456" width="192" height="64" rx="6" fill="#fffdf6" stroke="#d8c8a6" stroke-width="3"/>
    <rect x="-96" y="452" width="192" height="10" fill="#c4122f"/>
    <rect x="-96" y="462" width="192" height="6" fill="url(#hee)"/>
    <path d="M0 372L-60 440M0 372L-25 450M0 372L25 450M0 372L60 440" stroke="#d8c8a6" stroke-width="2"/>
    <circle cx="0" cy="372" r="9" fill="#e0a526"/>

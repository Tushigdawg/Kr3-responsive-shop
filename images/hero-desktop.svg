    <path d="M70 150c0-26 38-26 38 0 0-22 32-22 32 4 18-6 30 6 22 20H72c-14-2-18-18-2-24z"/>
    <path d="M300 90c0-20 30-20 30 0 0-18 26-18 26 3 14-5 24 5 18 16H302c-12-2-14-14-2-19z"/>
  </g>
  <!-- холмы -->
  <path d="M0 400C120 350 220 360 330 395S560 420 800 360V600H0z" fill="#31498f"/>
  <path d="M0 450C140 410 260 430 400 455S650 470 800 430V600H0z" fill="#22386f"/>
  <path d="M0 505C160 480 300 500 440 520S700 530 800 500V600H0z" fill="#16264f"/>

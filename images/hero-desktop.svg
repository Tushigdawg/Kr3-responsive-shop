      <stop offset="0" stop-color="#10286b"/>
      <stop offset="0.5" stop-color="#2f4f9f"/>
      <stop offset="0.78" stop-color="#e9863f"/>
      <stop offset="1" stop-color="#f6c36b"/>
    </linearGradient>
    <clipPath id="clip"><rect width="800" height="600" rx="47"/></clipPath>
    <pattern id="hee" width="24" height="24" patternUnits="userSpaceOnUse">
